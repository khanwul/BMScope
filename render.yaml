services:
  - type: web
    name: bmscope
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bmscope-db
          property: connectionString

databases:
  - name: bmscope-db
    plan: free
    databaseName: bmscope
    user: bmscope
